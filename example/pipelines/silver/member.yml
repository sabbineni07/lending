model_version: 1
id: pipeline.silver.member
layer: silver
enabled: true
verifies: dict.silver.member
depends_on: [pipeline.bronze.member]
dictionary_check:
  ignore_columns: []
sources:
  - name: member_file
    relation: lending.bronze.member_file
pre:
  - name: ensure_schema
    sql: CREATE SCHEMA IF NOT EXISTS lending.silver
  - name: ensure_quarantine_schema
    sql: CREATE SCHEMA IF NOT EXISTS lending.quarantine
  - name: ensure_audit_schema
    sql: CREATE SCHEMA IF NOT EXISTS lending.audit
  - name: ensure_audit
    sql: |
      CREATE TABLE IF NOT EXISTS lending.audit.pipeline_run (
        pipeline_id STRING,
        published_at TIMESTAMP
      ) USING DELTA
steps:
  - name: member_typed
    sql: |
      SELECT
        trim(MEMBER_NBR) AS member_id,
        to_date(AS_OF_DT, 'yyyy-MM-dd') AS as_of_date,
        CASE STATUS_CD
          WHEN 'A' THEN 'active'
          WHEN 'I' THEN 'inactive'
          WHEN 'C' THEN 'closed'
        END AS member_status,
        to_date(OPEN_DT, 'yyyy-MM-dd') AS member_since_date,
        CASE MEMBER_TYPE
          WHEN 'I' THEN 'individual'
          WHEN 'B' THEN 'business'
        END AS member_type,
        _ingest_timestamp
      FROM member_file
    dq:
      - name: unknown_member_code
        sql: |
          SELECT *
          FROM member_typed
          WHERE member_status IS NULL
             OR member_type IS NULL
             OR member_id IS NULL
             OR as_of_date IS NULL
             OR member_since_date IS NULL
        expect: empty
        on_fail: quarantine
        quarantine: lending.quarantine.silver_member
  - name: member_ready
    sql: |
      SELECT
        member_id,
        as_of_date,
        member_status,
        member_since_date,
        member_type
      FROM (
        SELECT
          member_typed.*,
          row_number() OVER (
            PARTITION BY member_id, as_of_date
            ORDER BY _ingest_timestamp DESC
          ) AS _rn
        FROM member_typed
      )
      WHERE _rn = 1
sink:
  name: publish_member
  target:
    name: lending.silver.member
    location: abfss://silver@lendingexample.dfs.core.windows.net/member
    format: delta
    partition_by: [as_of_date]
  sql: |
    MERGE INTO lending.silver.member AS t
    USING member_ready AS s
    ON t.member_id = s.member_id
    AND t.as_of_date = s.as_of_date
    WHEN MATCHED THEN UPDATE SET *
    WHEN NOT MATCHED THEN INSERT *
post:
  - name: record_run
    sql: |
      INSERT INTO lending.audit.pipeline_run (pipeline_id, published_at)
      SELECT 'pipeline.silver.member', current_timestamp()
