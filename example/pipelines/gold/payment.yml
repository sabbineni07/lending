model_version: 1
id: pipeline.gold.payment
layer: gold
enabled: true
verifies: dict.gold.payment
depends_on: [pipeline.silver.payment, pipeline.gold.loan]
dictionary_check:
  ignore_columns: []
sources:
  - name: payments
    relation: lending.silver.payment
  - name: loans
    relation: lending.gold.loan
pre:
  - name: ensure_schema
    sql: CREATE SCHEMA IF NOT EXISTS lending.gold
  - name: ensure_quarantine_schema
    sql: CREATE SCHEMA IF NOT EXISTS lending.quarantine
  - name: ensure_audit_schema
    sql: CREATE SCHEMA IF NOT EXISTS lending.audit
  - name: ensure_audit
    sql: |
      CREATE TABLE IF NOT EXISTS lending.audit.pipeline_run (
        pipeline_id STRING,
        published_at TIMESTAMP
      ) USING DELTA
steps:
  - name: payment_ready
    sql: |
      SELECT
        payment_id,
        loan_id,
        payment_effective_date,
        payment_amount,
        payment_principal_amount,
        payment_interest_amount,
        payment_fee_amount,
        payment_effect
      FROM payments
    dq:
      - name: loan_not_published
        sql: |
          SELECT payments.*
          FROM payment_ready AS payments
          LEFT JOIN loans
            ON payments.loan_id = loans.loan_id
          WHERE loans.loan_id IS NULL
        expect: empty
        on_fail: quarantine
        quarantine: lending.quarantine.gold_payment
      - name: reversal_not_negative
        sql: |
          SELECT *
          FROM payment_ready
          WHERE payment_effect = 'reversal'
            AND payment_amount >= 0
        expect: empty
        on_fail: fail
sink:
  name: publish_payment
  target:
    name: lending.gold.payment
    location: abfss://gold@lendingexample.dfs.core.windows.net/payment
    format: delta
  sql: |
    MERGE INTO lending.gold.payment AS t
    USING payment_ready AS s
    ON t.payment_id = s.payment_id
    WHEN MATCHED THEN UPDATE SET *
    WHEN NOT MATCHED THEN INSERT *
post:
  - name: record_run
    sql: |
      INSERT INTO lending.audit.pipeline_run (pipeline_id, published_at)
      SELECT 'pipeline.gold.payment', current_timestamp()
