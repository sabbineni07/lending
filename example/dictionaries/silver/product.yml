model_version: 1
id: dict.silver.product
layer: silver
entity: product
domain: lending
status: approved
version: 1
contact: contact.lending
grain: one row per product_code per as_of_date
primary_key: [product_code, as_of_date]
population: Product reference rows conformed from the bronze product extract.
description: >
  Conformed product history. Gold later publishes one current row per product
  from this history. The terms do not change between those grains.
attributes:
  - id: attr.silver.product.product_code
    name: product_code
    definition: Stable identifier of the lending product.
    logical_type: identifier
    physical_type: string
    nullable: false
    sensitivity: internal
    glossary_term: term.product_code
    representation: Trimmed PRODUCT_CD.
    examples: [UNSEC01]

  - id: attr.silver.product.as_of_date
    name: as_of_date
    definition: Business date this product snapshot describes.
    logical_type: date
    physical_type: date
    format: yyyy-MM-dd
    nullable: false
    sensitivity: internal
    glossary_term: term.as_of_date
    representation: AS_OF_DT parsed as a date.

  - id: attr.silver.product.product_name
    name: product_name
    definition: Business name of the product.
    logical_type: text
    physical_type: string
    nullable: false
    sensitivity: internal
    glossary_term: term.product_name
    representation: Trimmed PRODUCT_NM.

  - id: attr.silver.product.product_type
    name: product_type
    definition: Family the product belongs to.
    logical_type: code
    physical_type: string
    nullable: false
    allowed_values: [unsecured_installment, auto_secured, line_of_credit]
    sensitivity: internal
    glossary_term: term.product_type
    representation: >
      PRODUCT_TYPE_CD UI to unsecured_installment, AS to auto_secured,
      LC to line_of_credit. Unknown codes are rejected.

  - id: attr.silver.product.product_status
    name: product_status
    definition: Whether the institution offered the product on the as-of date.
    logical_type: code
    physical_type: string
    nullable: false
    allowed_values: [active, retired]
    sensitivity: internal
    glossary_term: term.product_status
    representation: PRODUCT_STATUS_CD A to active, R to retired. Unknown codes are rejected.
